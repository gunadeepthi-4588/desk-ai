<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DeskAI</title>
  <meta name="description" content="Log in to DeskAI Employee Assistant and Ticketing Platform.">
  <!-- Modern Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Shared & Login Stylesheets -->
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-page-container">
    <div class="login-card">
      <!-- Brand Header -->
      <div class="login-brand">
        <div class="brand-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z" fill="currentColor"/>
          </svg>
        </div>
        <h1>DeskAI</h1>
        <p class="login-subtitle">Sign in to your workplace assistant</p>
      </div>

      <!-- Demo Accounts Card -->
      <div class="demo-accounts-card">
        <div class="demo-card-header">
          <span class="demo-badge">Demo Accounts</span>
          <span class="demo-hint">Click to auto-fill</span>
        </div>
        <div class="demo-buttons-grid" style="grid-template-columns: repeat(3, 1fr);">
          <button type="button" class="demo-fill-btn" id="demo-employee-btn">
            <div class="demo-btn-title">👤 Employee</div>
            <div class="demo-btn-email">employee@gmail.com</div>
          </button>
          <button type="button" class="demo-fill-btn" id="demo-hr-btn">
            <div class="demo-btn-title">👥 HR Manager</div>
            <div class="demo-btn-email">hr@gmail.com</div>
          </button>
          <button type="button" class="demo-fill-btn" id="demo-admin-btn">
            <div class="demo-btn-title">🛡️ Admin</div>
            <div class="demo-btn-email">admin@gmail.com</div>
          </button>
        </div>
        <div class="demo-password-note">Password: <code>demo1234</code></div>
      </div>

      <!-- Error Alert -->
      <div id="login-error" class="login-error hidden">
        <span id="login-error-message" class="error-text">Invalid email or password.</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Work Email</label>
          <input type="email" id="login-email" placeholder="name@company.com" required autofocus autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" id="login-submit-btn" class="btn btn-primary login-btn">Sign In</button>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
